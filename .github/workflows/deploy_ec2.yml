name: Deploy EC2 server

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: reno-ec2-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AWS_DEPLOY_MODE == 'github'
    name: Build image and roll out on EC2
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
      AWS_ECR_REPOSITORY_URI: ${{ vars.AWS_ECR_REPOSITORY_URI }}
      AWS_PUBLIC_IP: ${{ vars.AWS_PUBLIC_IP }}
      GAME_PORT: ${{ vars.AWS_GAME_PORT || '54321' }}

    steps:
      - name: Check deployment configuration
        shell: bash
        run: |
          set -eu
          for name in AWS_REGION AWS_ROLE_ARN AWS_INSTANCE_ID AWS_ECR_REPOSITORY_URI AWS_PUBLIC_IP; do
            test -n "${!name:-}" || { echo "Repository variable $name is not configured" >&2; exit 64; }
          done

      - name: Check out committed source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Stage pinned BYOND archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker/vendor
          curl --fail --location --retry 5 --retry-delay 2 \
            https://www.byond.com/download/build/516/516.1688_byond_linux.zip \
            --output docker/vendor/516.1688_byond_linux.zip
          echo '16278f318cdeb4b77c57868dd7135032fde717ea6226269d22b2a1a50968e7f9  docker/vendor/516.1688_byond_linux.zip' | sha256sum -c -

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-duration-seconds: 7200
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push immutable image
        shell: bash
        run: |
          set -euo pipefail
          registry="${AWS_ECR_REPOSITORY_URI%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"
          image_uri="${AWS_ECR_REPOSITORY_URI}:${GITHUB_SHA}"
          if ! aws ecr describe-images --repository-name "${AWS_ECR_REPOSITORY_URI#*/}" \
              --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
            docker build --pull --platform linux/amd64 --tag "$image_uri" .
            docker push "$image_uri"
          fi
          echo "IMAGE_URI=$image_uri" >> "$GITHUB_ENV"

      - name: Pull image and perform guarded handoff
        id: rollout
        shell: bash
        run: |
          set -euo pipefail
          rollout_base64=$(base64 -w0 deploy/aws/rollout-ec2.sh)
          remote_script=$(cat <<EOF
          set -euo pipefail
          work_dir=\$(mktemp -d /var/tmp/reno-rollout.XXXXXX)
          trap 'rm -rf "\$work_dir"' EXIT
          printf '%s' '$rollout_base64' | base64 -d > "\$work_dir/rollout-ec2.sh"
          chmod 0755 "\$work_dir/rollout-ec2.sh"
          "\$work_dir/rollout-ec2.sh" \
            --image-uri '$IMAGE_URI' \
            --public-ip '$AWS_PUBLIC_IP' --port '$GAME_PORT'
          EOF
          )
          jq -n --arg command "$remote_script" \
            '{commands: [$command], executionTimeout: ["3600"]}' > "$RUNNER_TEMP/ssm-parameters.json"

          command_id=$(aws ssm send-command \
            --instance-ids "$AWS_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Reno ${GITHUB_SHA}" \
            --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --timeout-seconds 3600 \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

          for _ in $(seq 1 240); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$AWS_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID"
                exit 1
                ;;
            esac
            sleep 15
          done

          status=$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$AWS_INSTANCE_ID" \
            --query Status \
            --output text)
          test "$status" = Success
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$AWS_INSTANCE_ID" \
            --query StandardOutputContent \
            --output text

      - name: Show diagnostics after a failed rollout
        if: failure() && steps.rollout.outputs.command_id != ''
        shell: bash
        run: |
          aws ssm get-command-invocation \
            --command-id '${{ steps.rollout.outputs.command_id }}' \
            --instance-id "$AWS_INSTANCE_ID" || true
